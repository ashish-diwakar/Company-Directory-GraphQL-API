services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: directory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: company_directory
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - directory_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directory -d company_directory"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  directory_postgres:
