type Employee {
  id: ID!
  name: String!
  email: String!
  role: String!
  team: Team!
  assignedEquipment: [Equipment!]!
}

type Team {
  id: ID!
  name: String!
  department: String!
  members: [Employee!]!
}

type Equipment {
  id: ID!
  type: String!
  model: String!
  serialNumber: String!
  assignedTo: Employee
}

type Query {
  me: User
  users: [User!]!
  employees(role: String): [Employee!]!
  employee(id: ID!): Employee
  teams: [Team!]!
}

input PublicEmployeeInput {
  name: String!
  email: String!
  role: String!
  teamId: ID!
}

type Mutation {
  register(input: RegisterInput!): AuthPayload!
  signIn(email: String!, password: String!): AuthPayload!
  signOut: Boolean!
  updateProfile(name: String!): User!
  changePassword(currentPassword: String!, newPassword: String!): Boolean!
  createEmployee(input: PublicEmployeeInput!): Employee!
  assignEquipment(employeeId: ID!, equipmentId: ID!): Equipment!
}

enum AccountRole { ADMIN EMPLOYEE }
type User { id: ID! name: String! email: String! role: AccountRole! }
type AuthPayload { token: String! user: User! expiresAt: String! }
input RegisterInput { name: String! email: String! password: String! }

type Subscription {
  equipmentAssigned: Equipment!
}
