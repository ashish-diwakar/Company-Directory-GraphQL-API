type Employee {
  id: ID!
  name: String!
  email: String!
  role: String!
  team: Team!
  assignedEquipment: [Equipment!]!
}

type Team {
  id: ID!
  name: String!
  department: String!
  members: [Employee!]!
}

type Equipment {
  id: ID!
  type: String!
  model: String!
  serialNumber: String!
  assignedTo: Employee
}

type Query {
  equipmentHistory(equipmentId: ID, offset: Int = 0, limit: Int = 20): AssignmentHistoryPage!
  myEquipment: [Equipment!]!
  equipmentInventory(search: String, assigned: Boolean, offset: Int = 0, limit: Int = 20): EquipmentPage!
  me: User
  users: [User!]!
  employees(role: String): [Employee!]!
  employee(id: ID!): Employee
  teams: [Team!]!
}

input PublicEmployeeInput {
  name: String!
  email: String!
  role: String!
  teamId: ID!
}

type Mutation {
  returnEquipment(equipmentId: ID!, expectedEmployeeId: ID!, notes: String): Equipment!
  linkAccountToEmployee(userId: ID!, employeeId: ID): User!
  createEquipment(input: EquipmentInput!): Equipment!
  updateEquipment(id: ID!, input: EquipmentInput!): Equipment!
  register(input: RegisterInput!): AuthPayload!
  signIn(email: String!, password: String!): AuthPayload!
  signOut: Boolean!
  updateProfile(name: String!): User!
  changePassword(currentPassword: String!, newPassword: String!): Boolean!
  createEmployee(input: PublicEmployeeInput!): Employee!
  assignEquipment(employeeId: ID!, equipmentId: ID!): Equipment!
}

input EquipmentInput { type: String! model: String! serialNumber: String! }
type EquipmentPage { items: [Equipment!]! total: Int! }

enum AccountRole { ADMIN EMPLOYEE }
type User { id: ID! name: String! email: String! role: AccountRole! employee: Employee }
type AuthPayload { token: String! user: User! expiresAt: String! }
input RegisterInput { name: String! email: String! password: String! }

type Subscription {
  equipmentReturned: Equipment!
  equipmentAssigned: Equipment!
  myEquipmentChanged: Boolean!
}

enum AssignmentAction { ASSIGNED REASSIGNED RETURNED }
type AssignmentEvent {
  id: ID!
  equipmentId: ID!
  equipmentModel: String!
  serialNumber: String!
  action: AssignmentAction!
  actorId: ID!
  actorName: String!
  actorEmail: String!
  fromEmployeeId: ID
  fromEmployeeName: String
  toEmployeeId: ID
  toEmployeeName: String
  notes: String
  createdAt: String!
}
type AssignmentHistoryPage { items: [AssignmentEvent!]! total: Int! }
